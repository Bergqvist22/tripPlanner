# Local Postgres for development and for the test suite (`npm test` starts it).
# The suite uses its own database in this server, so development data is kept.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner
      POSTGRES_DB: tripplanner
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripplanner -d tripplanner"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
